name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Session-start hook test
        run: bash scripts/test_session_start_handoff.sh
